<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Colors</title>

    <!-- Tailwind CSS CDN Link -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-gray-100">

    <!-- Grid cols and rows -->
    <!-- https://tailwindcss.com/docs/grid-template-row -->

    <h2 class="text-center text-2xl font-bold">1. Grid cols and rows</h2>
    <div class="bg-pink-300 p-1 w-100 grid grid-cols-3 grid-rows-4">
        <div class="p-10 bg-green-200">01</div>
        <div class="p-10 bg-green-200">02</div>
        <div class="p-10 bg-green-200">03</div>
        <div class="p-10 bg-green-200">04</div>
        <div class="p-10 bg-green-200">05</div>
        <div class="p-10 bg-green-200">06</div>
        <div class="p-10 bg-green-200">07</div>
        <div class="p-10 bg-green-200">08</div>
        <div class="p-10 bg-green-200">09</div>
    </div>

    <br>
    <hr>
    <br>

    <!-- Col and row span -->
    <!-- https://tailwindcss.com/docs/grid-column -->
 
    <h2 class="text-center text-2xl font-bold">2. Col and row span</h2>
    <div class="bg-pink-300 w-100 grid grid-cols-3 gap-4">
        <div class="p-10 bg-green-200 col-span-1 row-span-3 p-10">01</div>
        <div class="p-10 bg-green-200">02</div>
        <div class="p-10 bg-green-200">03</div>
        <div class="p-10 bg-green-200">04</div>
        <div class="p-10 bg-green-200">05</div>
        <div class="p-10 bg-green-200">06</div>

        <br>
        <br>
        <br>
        <br>
    
        <div class="p-10 bg-teal-200 col-span-3">07</div>
        <div class="p-10 bg-teal-200">08</div>
        <div class="p-10 bg-teal-200 col-span-2">09</div>    
    </div>    
</body>
</html>
