<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better Tailwind CSS Setup</title>

    <script>
        /**
         * Tailwind CSS CLI Setup Steps:
         * 1. Install CLI:
         *    - npm install -D tailwindcss
         * 2. Setup Files:
         *    - Create input.css with: @import "tailwindcss";
         *    - Create output.css (will be generated)
         * 3. Run Build:
         *    - npx tailwindcss -i input.css -o output.css --watch
         * 4. Link CSS:
         *    - Add output.css to HTML head
         */
    </script>

    <link rel="stylesheet" href="output.css">
</head>
<body>
    <a href="">Click Me!</a>

    <button class="menu-component">Click</button>
    <button class="menu-component">Edit</button>

    <p class="text-salmon-200">This is a salmon color</p>

</body>
</html>
