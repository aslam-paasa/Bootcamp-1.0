<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Filters</title>

    <!-- Tailwind CSS CDN Link -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    
     <!-- Contrast -->
     <!-- https://tailwindcss.com/docs/contrast -->

    <h2 class="text-center text-2xl font-bold">1. Contrast</h2>
    <div class="border m-10 flex p-10">
        <img src="https://images.unsplash.com/photo-1499996860823-5214fcc65f8f?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGNoYXJhY3RlcnxlbnwwfHwwfHx8MA%3D%3D" class="w-[250px] h-[250px] contrast-50">
        <img src="https://images.unsplash.com/photo-1499996860823-5214fcc65f8f?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGNoYXJhY3RlcnxlbnwwfHwwfHx8MA%3D%3D" class="w-[250px] h-[250px] contrast-100">
        <img src="https://images.unsplash.com/photo-1499996860823-5214fcc65f8f?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGNoYXJhY3RlcnxlbnwwfHwwfHx8MA%3D%3D" class="w-[250px] h-[250px] contrast-150">
        <img src="https://images.unsplash.com/photo-1499996860823-5214fcc65f8f?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGNoYXJhY3RlcnxlbnwwfHwwfHx8MA%3D%3D" class="w-[250px] h-[250px] contrast-200">
    </div>

     <!-- Brightness -->
     <!-- https://tailwindcss.com/docs/brightness -->

    <h2 class="text-center text-2xl font-bold">2. Brightness</h2>
    <div class="border m-10 flex p-10">
        <img src="https://images.unsplash.com/photo-1516934024742-b461fba47600?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] brightness-50">
        <img src="https://images.unsplash.com/photo-1516934024742-b461fba47600?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] brightness-100">
        <img src="https://images.unsplash.com/photo-1516934024742-b461fba47600?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] brightness-150">
        <img src="https://images.unsplash.com/photo-1516934024742-b461fba47600?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] brightness-200">
    </div>
    
     <!-- Grayscale -->
     <!-- https://tailwindcss.com/docs/grayscale -->

     <h2 class="text-center text-2xl font-bold">3. Grayscale</h2>
     <div class="border m-10 flex p-10">
        <img src="https://images.unsplash.com/photo-1520552159191-e28a1d9f0d7e?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8d2lsZGxpZmV8ZW58MHx8MHx8fDA%3D" class="w-[250px] h-[250px]">
        <img src="https://images.unsplash.com/photo-1520552159191-e28a1d9f0d7e?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8d2lsZGxpZmV8ZW58MHx8MHx8fDA%3D" class="w-[250px] h-[250px] grayscale">
        <img src="https://images.unsplash.com/photo-1520552159191-e28a1d9f0d7e?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8d2lsZGxpZmV8ZW58MHx8MHx8fDA%3D" class="w-[250px] h-[250px] invert">
        <img src="https://images.unsplash.com/photo-1520552159191-e28a1d9f0d7e?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8d2lsZGxpZmV8ZW58MHx8MHx8fDA%3D" class="w-[250px] h-[250px] sepia">
     </div>
    

     <!-- Hue Rotate -->
     <!-- https://tailwindcss.com/docs/hue-rotate -->

     <h2 class="text-center text-2xl font-bold">4. Hue Rotate</h2>
     <div class="border m-10 flex p-10">
        <img src="https://plus.unsplash.com/premium_photo-1675098496724-65e2d3a972b0?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTd8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] ml-2">
        <img src="https://plus.unsplash.com/premium_photo-1675098496724-65e2d3a972b0?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTd8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] ml-2 hue-rotate-90">
        <img src="https://plus.unsplash.com/premium_photo-1675098496724-65e2d3a972b0?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTd8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] ml-2 hue-rotate-180">
        <img src="https://plus.unsplash.com/premium_photo-1675098496724-65e2d3a972b0?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTd8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] ml-2 hue-rotate-270">
        <img src="https://plus.unsplash.com/premium_photo-1675098496724-65e2d3a972b0?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTd8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] ml-2 hue-rotate-360">
     </div>

     <!-- Saturate -->
     <!-- https://tailwindcss.com/docs/saturate -->

     <h2 class="text-center text-2xl font-bold">5. Saturate</h2>
     <div class="border m-10 flex p-10">
        <img src="https://plus.unsplash.com/premium_photo-1661810799921-ded27d475104?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjF8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] saturate-0">
        <img src="https://plus.unsplash.com/premium_photo-1661810799921-ded27d475104?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjF8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] saturate-50">
        <img src="https://plus.unsplash.com/premium_photo-1661810799921-ded27d475104?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjF8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] saturate-100">
        <img src="https://plus.unsplash.com/premium_photo-1661810799921-ded27d475104?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjF8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] saturate-150">
        <img src="https://plus.unsplash.com/premium_photo-1661810799921-ded27d475104?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjF8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] saturate-200">
     </div>

     <!-- Blur -->
     <!-- https://tailwindcss.com/docs/blur -->

     <h2 class="text-center text-2xl font-bold">6. Blur</h2>    
     <div class="border m-10 flex p-10">
        <img src="https://plus.unsplash.com/premium_photo-1729791088946-c3994880b47c?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NDl8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] ml-2 blur-none">
        <img src="https://plus.unsplash.com/premium_photo-1729791088946-c3994880b47c?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NDl8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] ml-2 blur-sm">
        <img src="https://plus.unsplash.com/premium_photo-1729791088946-c3994880b47c?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NDl8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] ml-2 blur-md">
        <img src="https://plus.unsplash.com/premium_photo-1729791088946-c3994880b47c?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NDl8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] ml-2 blur-lg">
        <img src="https://plus.unsplash.com/premium_photo-1729791088946-c3994880b47c?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NDl8fHdpbGRsaWZlfGVufDB8fDB8fHww" class="w-[250px] h-[250px] ml-2 blur-xl">
     </div>
</body>
</html>
